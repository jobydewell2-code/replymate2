<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to ReplyMate Pro!</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 480px; }
    .checkmark { font-size: 4rem; margin-bottom: 24px; animation: pop 0.5s ease; }
    h1 { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 12px; }
    p { color: #7a7a9a; margin-bottom: 32px; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: #00e5a0;
      color: #000;
      padding: 14px 36px;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover { box-shadow: 0 8px 24px rgba(0,229,160,0.3); transform: translateY(-1px); }
    @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="checkmark">🎉</div>
    <h1>You're a Pro now!</h1>
    <p>Your ReplyMate Pro subscription is active. Enjoy unlimited AI-powered replies for your business.</p>
    <a href="/" class="btn" id="back-btn">Start Replying →</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    if (email) {
      fetch('/api/activate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
    }
  </script>
</body>
</html>
